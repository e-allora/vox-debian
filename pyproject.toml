[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["share*", "debian*", "tests*"]

[project]
name = "vox"
version = "1.0.0"
description = "CLI TTS reader using Piper neural TTS"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
vox = "vox.cli:main"

[project.optional-dependencies]
pdf = ["pymupdf"]
epub = ["ebooklib"]
markdown = ["mistune"]
all = ["pymupdf", "ebooklib", "mistune", "pyyaml"]
