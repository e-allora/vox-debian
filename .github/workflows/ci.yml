name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[all]" pytest pyyaml
      - run: python3 -m pytest tests/ -v
  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[all]"
      - run: sudo apt-get install -y build-essential devscripts debhelper dh-python lintian
      - run: dpkg-buildpackage -us -uc
      - run: lintian ../*.deb || true
